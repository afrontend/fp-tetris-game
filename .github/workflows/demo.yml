name: Update Demo GIF

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/demo.yml'

jobs:
  demo:
    runs-on: ubuntu-latest
    # 미러가 멈추면 기본값(6시간)까지 기다리므로 job 시간을 제한한다.
    timeout-minutes: 15
    permissions:
      contents: write
    # 쓰기 권한이 있는 job 이므로 action 은 커밋 SHA 로 고정한다 (Dependabot 이 갱신).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate demo GIF
        run: npm run demo

      - name: Upload demo GIF to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view screenshots &>/dev/null; then
            gh release create screenshots \
              --title "Screenshots" \
              --notes "Game screenshots (auto-updated)" \
              --target master
          fi
          gh release delete-asset screenshots demo.gif --yes 2>/dev/null || true
          gh release delete-asset screenshots preview.png --yes 2>/dev/null || true
          gh release upload screenshots demo.gif preview.png
