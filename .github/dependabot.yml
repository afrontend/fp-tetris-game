version: 2
updates:
  # 워크플로의 SHA 고정 action 을 새 릴리스로 올리는 PR 을 만든다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # npm 의존성. 게임 라이브러리(fp-*)는 배포 다음 날 PR 을 받도록 매일 확인하고,
  # 나머지는 cooldown 으로 새 버전이 충분히 지난 뒤에만 올린다.
  # (같은 ecosystem·directory 로 블록을 두 개 만들 수 없어 한 블록에서 나눈다.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
      exclude: ['fp-*']
    groups:
      # 먼저 맞는 그룹에 들어가므로 fp-* 그룹을 앞에 둔다.
      game-libraries:
        patterns: ['fp-*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
