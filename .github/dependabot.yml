version: 2
updates:
  # 워크플로의 SHA 고정 action 을 새 릴리스로 올리는 PR 을 만든다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # npm 의존성. 개발 의존성의 minor·patch 는 PR 하나로 묶는다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
